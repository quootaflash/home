<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunnak.com - Generator CV ATS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --primary: #1e2937; }
        
        * { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            background: white;
            box-shadow: 0 25px 50px -12px rgb(15 23 42 / 0.15);
            margin: 30px auto;
            padding: 25mm 20mm;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 11.5pt;
            line-height: 1.7;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        @media (max-width: 1024px) {
            .a4-paper { width: 100%; max-width: 210mm; margin: 20px auto; }
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; margin: 0; padding: 0; }
            .a4-paper {
                width: 210mm !important;
                height: 297mm !important;
                margin: 0 !important;
                padding: 25mm 20mm !important;
                box-shadow: none !important;
                border: none !important;
            }
        }

        .profile-img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border: 4px solid #f1f5f9;
        }

        .section-title {
            position: relative;
            padding-bottom: 8px;
        }
        
        .section-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 2px;
            background: #1e2937;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans">

    <!-- NAVBAR -->
    <nav class="bg-slate-950 text-white sticky top-0 z-50 no-print shadow-md">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <i class="fa-solid fa-file-lines text-3xl"></i>
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight">DUNNAK.COM</h1>
                    <p class="text-xs text-slate-400 -mt-0.5">CV ATS Generator by Mahesa</p>
                </div>
            </div>
            
            <div class="flex items-center gap-x-3">
                <button onclick="autoSaveDraft()" class="flex items-center gap-x-2 px-5 h-10 bg-white/10 hover:bg-white/20 rounded-2xl text-sm font-medium">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span class="hidden md:inline">Simpan Draft</span>
                </button>
                <button onclick="saveAsImage()" class="flex items-center gap-x-2 px-5 h-10 bg-violet-600 hover:bg-violet-700 text-white rounded-2xl text-sm font-medium">
                    <i class="fa-solid fa-image"></i>
                    <span class="hidden sm:inline">Unduh PNG</span>
                </button>
                <button onclick="generatePDF()" class="flex items-center gap-x-2 px-6 h-10 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl text-sm font-medium">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>PDF</span>
                </button>
                <button onclick="printLetter()" class="flex items-center gap-x-2 px-6 h-10 bg-white text-slate-950 hover:bg-slate-100 rounded-2xl text-sm font-medium">
                    <i class="fa-solid fa-print"></i>
                    <span>Cetak</span>
                </button>
                <button onclick="clearForm()" class="flex items-center justify-center w-10 h-10 text-red-400 hover:text-red-500 rounded-2xl">
                    <i class="fa-solid fa-trash text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-screen-2xl mx-auto px-6 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- FORM INPUT -->
            <div class="lg:col-span-5 bg-white rounded-3xl shadow-xl p-8 no-print">
                <h2 class="text-2xl font-semibold text-slate-800 mb-8">Isi Data CV Anda</h2>
                
                <div class="space-y-10">

                    <!-- Foto Profil -->
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">Foto Profil (opsional - ATS friendly)</label>
                        <input type="file" id="foto-upload" accept="image/*" class="hidden" onchange="previewFoto(this)">
                        <button onclick="document.getElementById('foto-upload').click()" 
                                class="w-full h-32 border-2 border-dashed border-slate-300 hover:border-slate-400 rounded-3xl flex flex-col items-center justify-center text-slate-500">
                            <i class="fa-solid fa-user-circle text-4xl mb-2"></i>
                            <span class="text-sm">Upload Foto</span>
                        </button>
                        <img id="foto-preview" class="hidden mx-auto mt-4 rounded-2xl shadow" style="width:110px; height:110px; object-fit:cover;">
                    </div>

                    <!-- Data Pribadi -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">1. Data Pribadi</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-slate-600 mb-2">Nama Lengkap</label>
                                <input id="nama" type="text" value="Muhammad Hafis" 
                                       class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" oninput="updatePreview()">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-600 mb-2">No. Telepon</label>
                                <input id="telepon" type="tel" value="0856-1234-5678" 
                                       class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" oninput="updatePreview()">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-600 mb-2">Email</label>
                                <input id="email" type="email" value="hafis@example.com" 
                                       class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" oninput="updatePreview()">
                            </div>
                        </div>
                        <div class="mt-4">
                            <label class="block text-sm font-medium text-slate-600 mb-2">Alamat / Kota</label>
                            <input id="alamat" type="text" value="Paninggaran, Pekalongan, Jawa Tengah" 
                                   class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" oninput="updatePreview()">
                        </div>
                        <div class="grid grid-cols-2 gap-4 mt-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-600 mb-2">LinkedIn / GitHub</label>
                                <input id="linkedin" type="text" value="linkedin.com/in/hafis" 
                                       class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" oninput="updatePreview()">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-600 mb-2">Tanggal Lahir</label>
                                <input id="tgl-lahir" type="date" class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" oninput="updatePreview()">
                            </div>
                        </div>
                    </div>

                    <!-- Pendidikan -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">2. Pendidikan</h3>
                        <div class="space-y-6">
                            <div>
                                <input id="pendidikan1" type="text" value="SMK Nurul Ummah Paninggaran - Teknik Jaringan Komputer dan Telekomunikasi" 
                                       class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl mb-2" placeholder="Nama Sekolah / Universitas" oninput="updatePreview()">
                                <input id="tahun1" type="text" value="2023 - 2026" 
                                       class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" placeholder="Tahun" oninput="updatePreview()">
                            </div>
                        </div>
                    </div>

                    <!-- Pengalaman Kerja / Magang -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">3. Pengalaman</h3>
                        <textarea id="pengalaman" rows="6" class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" 
                                  oninput="updatePreview()">• Magang IT Support di PT. ABC (Januari - Maret 2025)
• Membantu maintenance jaringan sekolah
• Membuat website sederhana menggunakan HTML & Tailwind</textarea>
                    </div>

                    <!-- Keterampilan -->
                    <div>
                        <h3 class="uppercase text-xs tracking-widest font-medium text-slate-500 mb-4">4. Keterampilan</h3>
                        <textarea id="keterampilan" rows="5" class="form-input w-full px-5 py-4 border border-slate-200 rounded-3xl" 
                                  oninput="updatePreview()">• Microsoft Office (Word, Excel, PowerPoint)
• Jaringan Komputer (Cisco CCNA dasar)
• HTML, CSS, Tailwind CSS
• Troubleshooting Hardware & Software
• Bahasa Inggris (Pasif-Aktif)</textarea>
                    </div>

                </div>
            </div>

            <!-- PREVIEW CV -->
            <div class="lg:col-span-7">
                <div class="flex justify-between items-center mb-4 px-2">
                    <h3 class="font-semibold text-slate-700 flex items-center gap-x-2">
                        <i class="fa-solid fa-eye"></i> Pratinjau CV ATS
                    </h3>
                    <span class="text-xs bg-emerald-100 text-emerald-700 px-4 py-2 rounded-3xl">Format A4 - ATS Friendly</span>
                </div>
                
                <div class="bg-white p-6 rounded-3xl shadow-inner overflow-x-auto">
                    <div id="cv" class="a4-paper mx-auto">
                        <div id="cv-content" class="relative z-10"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cvData = {
            foto: null,
            nama: "Muhammad Hafis",
            telepon: "0856-1234-5678",
            email: "hafis@example.com",
            alamat: "Paninggaran, Pekalongan, Jawa Tengah",
            linkedin: "linkedin.com/in/hafis",
            tglLahir: "",
            pendidikan: "SMK Nurul Ummah Paninggaran - Teknik Jaringan Komputer dan Telekomunikasi",
            tahunPendidikan: "2023 - 2026",
            pengalaman: "• Magang IT Support di PT. ABC (Januari - Maret 2025)\n• Membantu maintenance jaringan sekolah\n• Membuat website sederhana menggunakan HTML & Tailwind",
            keterampilan: "• Microsoft Office (Word, Excel, PowerPoint)\n• Jaringan Komputer (Cisco CCNA dasar)\n• HTML, CSS, Tailwind CSS\n• Troubleshooting Hardware & Software\n• Bahasa Inggris (Pasif-Aktif)"
        }

        function updatePreview() {
            cvData.nama = document.getElementById('nama').value;
            cvData.telepon = document.getElementById('telepon').value;
            cvData.email = document.getElementById('email').value;
            cvData.alamat = document.getElementById('alamat').value;
            cvData.linkedin = document.getElementById('linkedin').value;
            cvData.tglLahir = document.getElementById('tgl-lahir').value;
            cvData.pendidikan = document.getElementById('pendidikan1').value;
            cvData.tahunPendidikan = document.getElementById('tahun1').value;
            cvData.pengalaman = document.getElementById('pengalaman').value;
            cvData.keterampilan = document.getElementById('keterampilan').value;

            const fotoHTML = cvData.foto 
                ? `<img src="${cvData.foto}" class="profile-img rounded-2xl mx-auto" alt="Foto">` 
                : `<div class="w-[110px] h-[110px] bg-slate-100 rounded-2xl mx-auto flex items-center justify-center text-slate-400">
                     <i class="fa-solid fa-user text-5xl"></i>
                   </div>`;

            const contentHTML = `
                <div class="text-center mb-8">
                    ${fotoHTML}
                    <h1 class="text-4xl font-bold tracking-tight mt-6 text-slate-900">${cvData.nama}</h1>
                    <p class="text-slate-600 mt-1">Fresh Graduate | Teknik Komputer & Jaringan</p>
                </div>

                <div class="grid grid-cols-3 gap-8 text-sm">
                    <div class="col-span-2">
                        <!-- Kontak -->
                        <div class="mb-8">
                            <p class="flex items-center gap-2"><i class="fa-solid fa-phone w-5"></i> ${cvData.telepon}</p>
                            <p class="flex items-center gap-2"><i class="fa-solid fa-envelope w-5"></i> ${cvData.email}</p>
                            <p class="flex items-center gap-2"><i class="fa-solid fa-location-dot w-5"></i> ${cvData.alamat}</p>
                            ${cvData.linkedin ? `<p class="flex items-center gap-2"><i class="fa-brands fa-linkedin w-5"></i> ${cvData.linkedin}</p>` : ''}
                        </div>

                        <!-- Pendidikan -->
                        <div class="mb-10">
                            <h2 class="section-title text-xl font-semibold mb-4">Pendidikan</h2>
                            <p class="font-medium">${cvData.pendidikan}</p>
                            <p class="text-slate-600">${cvData.tahunPendidikan}</p>
                        </div>

                        <!-- Pengalaman -->
                        <div class="mb-10">
                            <h2 class="section-title text-xl font-semibold mb-4">Pengalaman</h2>
                            <div class="text-slate-700 whitespace-pre-line leading-relaxed">
                                ${cvData.pengalaman.replace(/\n/g, '<br>')}
                            </div>
                        </div>

                        <!-- Keterampilan -->
                        <div>
                            <h2 class="section-title text-xl font-semibold mb-4">Keterampilan</h2>
                            <div class="text-slate-700 whitespace-pre-line leading-relaxed">
                                ${cvData.keterampilan.replace(/\n/g, '<br>')}
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar Kanan (opsional untuk ATS) -->
                    <div class="border-l border-slate-200 pl-8">
                        <div class="mb-8">
                            <h3 class="font-medium text-slate-500 mb-2">Tanggal Lahir</h3>
                            <p>${cvData.tglLahir ? new Date(cvData.tglLahir).toLocaleDateString('id-ID') : '—'}</p>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('cv-content').innerHTML = contentHTML;
        }

        function previewFoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    cvData.foto = e.target.result;
                    document.getElementById('foto-preview').src = cvData.foto;
                    document.getElementById('foto-preview').classList.remove('hidden');
                    updatePreview();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function printLetter() {
            updatePreview();
            window.print();
        }

        function generatePDF() {
            const ok = confirm('Akan membuka dialog cetak. Pilih "Simpan sebagai PDF".');
            if (ok) printLetter();
        }

        function saveAsImage() {
            const cv = document.getElementById('cv');
            html2canvas(cv, { scale: 3, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = `CV_${cvData.nama.replace(/[^a-zA-Z0-9]/g, '_')}_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function autoSaveDraft() {
            alert('✅ Draft CV berhasil disimpan!');
        }

        function clearForm() {
            if (!confirm('Reset semua data CV?')) return;
            location.reload();
        }

        // Initialize
        window.onload = () => {
            updatePreview();
            console.log('%cDunnak.com - Generator CV ATS v1.0 siap digunakan', 'color:#10b981; font-weight:600');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap & Match Multiplayer</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #121212;
  color: white;
}

#grid {
  display: grid;
  grid-template-columns: repeat(3, 80px);
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}

.cell {
  width: 80px;
  height: 80px;
  background: #333;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.active {
  background: #00c853;
}

button {
  margin: 10px;
  padding: 10px 15px;
  border: none;
  background: #00c853;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<h2>Tap & Match Multiplayer</h2>
<p id="info">Masukkan jumlah pemain (1-4)</p>

<input type="number" id="playerCount" min="1" max="4">
<button onclick="setupPlayers()">Start</button>

<div id="players"></div>
<div id="grid"></div>

<script>
let players = [];
let currentPlayer = 0;
let sequence = [];
let userIndex = 0;
let state = "idle";

const grid = document.getElementById("grid");
const info = document.getElementById("info");

function setupPlayers() {
  const count = parseInt(document.getElementById("playerCount").value);
  if (!count || count < 1 || count > 4) return alert("1-4 pemain");

  players = [];
  for (let i = 0; i < count; i++) {
    let name = prompt("Nama pemain " + (i+1));
    players.push({ name: name || "P"+(i+1), score: 0 });
  }

  createGrid();
  startTurn();
}

function createGrid() {
  grid.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    let cell = document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.index = i;
    cell.onclick = () => handleClick(i);
    grid.appendChild(cell);
  }
}

function startTurn() {
  sequence = [];
  userIndex = 0;
  info.innerText = players[currentPlayer].name + " mulai!";
  nextRound();
}

function nextRound() {
  state = "showing";
  sequence.push(Math.floor(Math.random() * 9));
  showSequence();
}

function showSequence() {
  const cells = document.querySelectorAll(".cell");
  let i = 0;

  let interval = setInterval(() => {
    let idx = sequence[i];
    cells[idx].classList.add("active");

    setTimeout(() => cells[idx].classList.remove("active"), 400);

    i++;
    if (i >= sequence.length) {
      clearInterval(interval);
      state = "input";
      userIndex = 0;
      info.innerText = "Giliran klik!";
    }
  }, 700);
}

function handleClick(index) {
  if (state !== "input") return;

  if (index !== sequence[userIndex]) {
    endTurn();
    return;
  }

  userIndex++;

  if (userIndex === sequence.length) {
    players[currentPlayer].score++;
    setTimeout(nextRound, 600);
  }
}

function endTurn() {
  alert(players[currentPlayer].name + " selesai! Skor: " + players[currentPlayer].score);

  currentPlayer++;

  if (currentPlayer >= players.length) {
    showWinner();
  } else {
    startTurn();
  }
}

function showWinner() {
  let winner = players.sort((a,b)=>b.score-a.score)[0];
  info.innerText = "Pemenang: " + winner.name + " 🏆";
}
</script>

</body>
</html>

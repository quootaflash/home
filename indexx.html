<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BillingKas TKJT 2 • Tagihan Kas Kelas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --primary: #10b981; }
        
        * { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        .fresh-card {
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            box-shadow: 0 20px 40px -15px rgb(16 185 129 / 0.15);
        }
        
        /* STRUK SUPERMARKET STYLE */
        .receipt-paper {
            width: 85mm;
            min-height: 240mm;
            background: white;
            box-shadow: 25px 25px 40px -15px rgb(0 0 0 / 0.2);
            margin: 20px auto;
            padding: 12mm 8mm;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 10.5pt;
            line-height: 1.65;
            border: 1px solid #e2e8f0;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        
        @media (max-width: 768px) {
            .receipt-paper {
                width: 100% !important;
                max-width: 85mm;
                margin: 12px auto;
            }
        }
        
        /* PITA GARIS UNIK */
        .pita-unik {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: repeating-linear-gradient(90deg, #10b981, #10b981 12px, #059669 12px, #059669 24px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10pt;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 -6px 20px rgba(16, 185, 129, 0.4);
            z-index: 30;
            overflow: hidden;
        }
        
        .pita-unik::before {
            content: "OFFICIAL TKJT 2 • TIDAK BISA DIPALSUKAN • VERIFIED KAS";
            position: absolute;
            white-space: nowrap;
            animation: scrollPita 10s linear infinite;
            opacity: 0.95;
        }
        
        @keyframes scrollPita {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        /* KOP PROFESSIONAL */
        .kop-professional {
            border-bottom: 6px solid #10b981;
            padding-bottom: 14px;
            text-align: center;
        }
        
        .watermark-fresh {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-22deg);
            font-size: 42px;
            font-weight: 900;
            color: rgba(16, 185, 129, 0.09);
            pointer-events: none;
            z-index: 1;
            letter-spacing: 14px;
            white-space: nowrap;
        }
        
        /* QR CODE - POSISI AMAN */
        .qr-safe {
            position: absolute;
            bottom: 68px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            z-index: 20;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans">

<nav class="bg-gradient-to-r from-slate-950 to-emerald-900 text-white sticky top-0 z-50 shadow-lg">
    <div class="max-w-screen-2xl mx-auto px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-x-3">
            <i class="fa-solid fa-cash-register text-4xl"></i>
            <div>
                <h1 class="text-2xl font-bold tracking-tighter">BillingKas TKJT 2</h1>
                <p class="text-xs text-emerald-300 -mt-0.5">Sistem Tagihan Kas Kelas TKJT 2</p>
            </div>
        </div>
    </div>
</nav>

<div class="max-w-5xl mx-auto px-4 py-6 md:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- FORM -->
        <div class="fresh-card rounded-3xl shadow-xl p-6 md:p-8">
            <h2 class="text-2xl font-semibold mb-6 flex items-center gap-x-3">
                <i class="fa-solid fa-receipt text-emerald-600"></i>
                Buat Billing Kas TKJT 2
            </h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Nama Siswa</label>
                    <input id="nama-siswa" type="text" placeholder="Nama Lengkap Siswa" 
                           class="w-full px-5 py-4 border border-slate-200 rounded-3xl text-base focus:outline-none focus:border-emerald-500">
                </div>
                
                <div class="flex items-center gap-x-3">
                    <input type="checkbox" id="lunas" class="w-5 h-5 accent-emerald-600" onchange="toggleTunggakan()">
                    <label for="lunas" class="text-sm font-medium text-slate-600 cursor-pointer flex-1">Sudah Lunas (Tidak Menunggak)</label>
                </div>
                
                <div id="form-tunggakan" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">Jumlah Tunggakan per Kali (Rp)</label>
                        <input id="jumlah-tunggakan" type="number" value="50000" 
                               class="w-full px-5 py-4 border border-slate-200 rounded-3xl text-base" oninput="hitungOtomatis()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">Sudah Menunggak Berapa Kali?</label>
                        <input id="kali-menunggak" type="number" value="1" min="1" 
                               class="w-full px-5 py-4 border border-slate-200 rounded-3xl text-base" oninput="hitungOtomatis()">
                    </div>
                    <div id="total-tunggakan-display" class="bg-emerald-50 border border-emerald-200 rounded-3xl px-5 py-4 text-sm hidden">
                        <span class="font-medium">Total Tunggakan:</span>
                        <span id="total-tunggakan" class="font-semibold text-emerald-700 text-xl ml-2">Rp 0</span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-2">Keterangan</label>
                        <textarea id="keterangan" rows="2" placeholder="Belum bayar iuran bulan Maret & April 2026" 
                                  class="w-full px-5 py-4 border border-slate-200 rounded-3xl text-base"></textarea>
                    </div>
                </div>
                
                <button onclick="buatBilling()" 
                        class="w-full py-5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-semibold text-lg rounded-3xl flex items-center justify-center gap-x-3 shadow-md active:scale-95">
                    <i class="fa-solid fa-file-invoice"></i>
                    Buat & Tampilkan Billing
                </button>
            </div>
        </div>
        
        <!-- PREVIEW -->
        <div>
            <div class="mb-4 flex justify-between items-center px-1">
                <h3 class="font-semibold text-slate-700 flex items-center gap-x-2">
                    <i class="fa-solid fa-receipt"></i> Struk Billing TKJT 2
                </h3>
                <span class="text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-medium">Mirip Struk Supermarket</span>
            </div>
            
            <div id="preview-wrapper" class="bg-white p-4 rounded-3xl shadow-inner">
                <div id="receipt-paper" class="receipt-paper mx-auto relative">
                    <div class="watermark-fresh">TKJT 2</div>
                    <div id="receipt-content" class="relative z-10"></div>
                    
                    <!-- QR CODE DI POSISI AMAN (tidak menutupi nominal) -->
                    <div id="qr-center" class="qr-safe"></div>
                    
                    <div class="pita-unik"></div>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 mt-6">
                <button onclick="cetakBilling()" 
                        class="flex-1 py-4 bg-slate-900 text-white rounded-3xl font-medium flex items-center justify-center gap-x-2 text-base active:scale-95">
                    <i class="fa-solid fa-print"></i> Cetak Struk
                </button>
                <button onclick="simpanGambar()" 
                        class="flex-1 py-4 bg-violet-600 text-white rounded-3xl font-medium flex items-center justify-center gap-x-2 text-base active:scale-95">
                    <i class="fa-solid fa-download"></i> Simpan PNG
                </button>
                <button onclick="bagikanWA()" 
                        class="flex-1 py-4 bg-green-600 text-white rounded-3xl font-medium flex items-center justify-center gap-x-2 text-base active:scale-95">
                    <i class="fa-brands fa-whatsapp"></i> Kirim ke WA
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// GLOBAL
let currentBilling = null;

function toggleTunggakan() {
    const lunas = document.getElementById('lunas').checked;
    document.getElementById('form-tunggakan').style.display = lunas ? 'none' : 'block';
    hitungOtomatis();
}

function hitungOtomatis() {
    const jumlah = parseInt(document.getElementById('jumlah-tunggakan').value) || 0;
    const kali = parseInt(document.getElementById('kali-menunggak').value) || 0;
    const total = jumlah * kali;
    
    const display = document.getElementById('total-tunggakan-display');
    const span = document.getElementById('total-tunggakan');
    
    if (kali > 0 && jumlah > 0) {
        display.classList.remove('hidden');
        span.textContent = `Rp ${total.toLocaleString('id-ID')}`;
    } else {
        display.classList.add('hidden');
    }
}

function buatBilling() {
    const nama = document.getElementById('nama-siswa').value.trim();
    if (!nama) {
        alert("⚠️ Nama siswa wajib diisi!");
        return;
    }
    
    const lunas = document.getElementById('lunas').checked;
    const jumlah = lunas ? 0 : parseInt(document.getElementById('jumlah-tunggakan').value) || 0;
    const kali = lunas ? 0 : parseInt(document.getElementById('kali-menunggak').value) || 0;
    
    currentBilling = {
        nama: nama,
        kelas: "TKJT 2",
        lunas: lunas,
        jumlah: jumlah,
        kali: kali,
        total: jumlah * kali,
        keterangan: document.getElementById('keterangan').value || "",
        tanggal: new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'}),
        id: 'TKJT2-' + Date.now().toString(36).toUpperCase().padStart(8, '0')
    };
    
    renderReceipt();
}

function renderReceipt() {
    if (!currentBilling) return;
    
    let statusHTML = currentBilling.lunas 
        ? `<div class="text-emerald-600 text-3xl font-bold mb-2">LUNAS ✅</div>`
        : `
            <div class="text-orange-600 text-3xl font-bold">TUNGGKAN</div>
            <div class="text-5xl font-semibold text-orange-600">Rp ${currentBilling.total.toLocaleString('id-ID')}</div>
            <div class="text-xs text-slate-500">${currentBilling.kali} kali</div>
          `;
    
    const html = `
        <div class="kop-professional mb-8">
            <h1 class="text-4xl font-bold text-emerald-700">KAS TKJT 2</h1>
            <p class="text-xs text-slate-600 mt-1">Tagihan Iuran Kas Kelas TKJT 2</p>
            <p class="text-sm text-slate-500 mt-4">${currentBilling.tanggal}</p>
        </div>
        
        <div class="space-y-3 text-sm mb-8">
            <div class="flex justify-between"><span class="font-medium">Nama Siswa</span><span class="font-semibold">${currentBilling.nama}</span></div>
            <div class="flex justify-between"><span class="font-medium">Kelas</span><span class="font-semibold">${currentBilling.kelas}</span></div>
        </div>
        
        <div class="border border-dashed border-slate-300 rounded-2xl p-6 text-center mb-12">
            ${statusHTML}
            ${currentBilling.keterangan ? `<p class="mt-6 text-xs italic">${currentBilling.keterangan}</p>` : ''}
        </div>
        
        <div class="text-center text-[10px] text-slate-400 mb-6">
            ID Billing • ${currentBilling.id}
        </div>
    `;
    
    document.getElementById('receipt-content').innerHTML = html;
    
    // QR CODE DI POSISI AMAN (tidak menutupi nominal)
    const qrContainer = document.getElementById('qr-center');
    qrContainer.innerHTML = `<div id="qr-inner" class="w-28 h-28"></div>`;
    
    const qrData = `https://kaskelas-tkjt2.local/verify?hash=${currentBilling.id}&nama=${encodeURIComponent(currentBilling.nama)}&total=${currentBilling.total}`;
    
    new QRCode(document.getElementById("qr-inner"), {
        text: qrData,
        width: 112,
        height: 112,
        colorDark: "#052e16",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });
}

function cetakBilling() {
    if (!currentBilling) return alert("Buat billing dulu!");
    window.print();
}

function simpanGambar() {
    if (!currentBilling) return alert("Buat billing dulu!");
    
    html2canvas(document.getElementById('receipt-paper'), { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Billing_Kas_TKJT2_${currentBilling.nama}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        const notif = document.createElement('div');
        notif.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#10b981;color:white;padding:16px 24px;border-radius:9999px;box-shadow:0 15px 25px -5px rgb(16 185 129);z-index:99999;';
        notif.textContent = '✅ Struk PNG berhasil disimpan';
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 2200);
    });
}

function bagikanWA() {
    if (!currentBilling) return alert("Buat billing dulu!");
    
    html2canvas(document.getElementById('receipt-paper'), { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Billing_Kas_TKJT2_${currentBilling.nama}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        const pesan = `Assalamualaikum,\n\nBerikut struk billing kas kelas TKJT 2:\nNama: ${currentBilling.nama}\nStatus: ${currentBilling.lunas ? 'LUNAS' : 'Tunggakan Rp ' + currentBilling.total.toLocaleString('id-ID')}\nTanggal: ${currentBilling.tanggal}\n\nMohon segera dilunasi ke bendahara.\nTerima kasih!`;
        
        setTimeout(() => {
            window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
        }, 800);
        
        const notif = document.createElement('div');
        notif.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#10b981;color:white;padding:16px 24px;border-radius:9999px;box-shadow:0 15px 25px -5px rgb(16 185 129);z-index:99999;';
        notif.innerHTML = '✅ Struk PNG disimpan!<br><span class="text-xs">Silakan lampirkan di WhatsApp</span>';
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    });
}

// INIT
window.onload = () => {
    tailwind.config = {};
    toggleTunggakan();
    
    setTimeout(() => {
        document.getElementById('nama-siswa').value = "Ahmad Rizki Pratama";
        document.getElementById('keterangan').value = "Belum bayar iuran bulan Maret & April 2026";
    }, 600);
    
    console.log('%c✅ BillingKas TKJT 2 siap • QR di posisi aman • Struk profesional', 'color:#10b981;font-weight:700');
};
</script>
</body>
</html>
